name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ABI 依赖
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      - name: 构建
        run: make
      - name: Run C tests
        run: make test
      - name: Run Python wrapper tests
        run: KVSPACE_C_SO=build/libkvspace-c.so python3 py/tests/test_wire.py
